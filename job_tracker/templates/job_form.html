{% extends "base.html" %}
{% block content %}
<h1>{{ action }} Job</h1>
<form method="post">
  <p><label>Company *<br>
    <select name="company_id" required>
      <option value="">-- choose --</option>
      {% for c in companies %}
      <option value="{{ c.company_id }}" {{ 'selected' if job.get('company_id')|string == c.company_id|string else '' }}>{{ c.company_name }}</option>
      {% endfor %}
    </select></label></p>
  <p><label>Job title *<br>
    <input type="text" name="job_title" maxlength="100" value="{{ job.get('job_title') or '' }}" required></label></p>
  <p><label>Description<br>
    <textarea name="job_description" rows="4" cols="40">{{ job.get('job_description') or '' }}</textarea></label></p>
  <p><label>Salary min<br>
    <input type="number" step="0.01" name="salary_min" value="{{ job.get('salary_min') or '' }}"></label></p>
  <p><label>Salary max<br>
    <input type="number" step="0.01" name="salary_max" value="{{ job.get('salary_max') or '' }}"></label></p>
  <p><label>Job type<br>
    <select name="job_type">
      <option value="">-- choose --</option>
      {% for t in job_types %}
      <option value="{{ t }}" {{ 'selected' if job.get('job_type') == t else '' }}>{{ t }}</option>
      {% endfor %}
    </select></label></p>
  <p><label>Posting URL<br>
    <input type="text" name="posting_url" maxlength="500" value="{{ job.get('posting_url') or '' }}"></label></p>
  <p><label>Date posted<br>
    <input type="date" name="date_posted" value="{{ job.get('date_posted') or '' }}"></label></p>
  <p><label>Required skills (comma-separated)<br>
    <input type="text" name="requirements" size="50" value="{{ job.get('requirements') or '' }}"></label></p>
  <p><label><input type="checkbox" name="is_active" {{ 'checked' if job.get('is_active') else '' }}> Active posting</label></p>
  <button type="submit">Save</button>
  <a href="{{ url_for('jobs_list') }}">Cancel</a>
</form>
{% endblock %}
